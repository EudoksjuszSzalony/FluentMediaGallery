name: Core CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/FluentMediaGallery.Core.Smoke/FluentMediaGallery.Core.Smoke.csproj
      - name: Build
        run: dotnet build tests/FluentMediaGallery.Core.Smoke/FluentMediaGallery.Core.Smoke.csproj -c Release --no-restore
      - name: Core smoke tests
        run: dotnet run --project tests/FluentMediaGallery.Core.Smoke/FluentMediaGallery.Core.Smoke.csproj -c Release --no-build
